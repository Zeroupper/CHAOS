  # # ============================================================
  # # OBJECTIVE — Complex
  # # ============================================================

  - id: "obj_011"
    category: "objective"
    difficulty: "complex"
    query: >
      Among participants who completed the end-of-term depression assessment,
      what is the difference in mean 14-day rolling screen unlock count
      between those flagged as depressed and those not flagged? Report as
      (depressed mean minus not-depressed mean), rounded to 4 decimal places.
    hint: >
      The `dep_endterm` dataset (SurveyData) has columns `pid` and `dep`
      (boolean). The `screen` dataset (FeatureData) has column
      `f_screen:phone_screen_rapids_countepisodeunlock:14dhist`. Join on
      `pid`, group by `dep`, compute the mean of the screen column (ignoring
      NaN), and subtract.

  - id: "obj_012"
    category: "objective"
    difficulty: "complex"
    query: >
      Which participant has the highest average 14-day rolling intraday step
      count? Report their end-of-term BDI-II depression score. If that
      participant has no end-of-term score, report -1.
    hint: >
      The `steps` dataset (FeatureData) has column
      `f_steps:fitbit_steps_intraday_rapids_sumsteps:14dhist`. Compute the
      mean per participant (ignoring NaN) and find the participant with the
      highest value. Then look up their `BDI2` score in the `dep_endterm`
      dataset (SurveyData).

  - id: "obj_013"
    category: "objective"
    difficulty: "complex"
    query: >
      For participant INS-W_009, what is the Pearson correlation between
      their weekly self-reported depression score (feel_depressed) and the
      weekly average of their daily 14-day rolling screen unlock count?
      Match on the ISO week of each date. Round to 4 decimal places.
    hint: >
      The `dep_weekly` dataset (SurveyData) has columns `pid`, `date`, and
      `feel_depressed`. The `screen` dataset (FeatureData) has column
      `f_screen:phone_screen_rapids_countepisodeunlock:14dhist` with a
      `date` column. Extract the ISO week from each date, average the daily
      screen values per week, join on ISO week, drop rows with NaN, and
      compute the Pearson correlation.

  - id: "obj_014"
    category: "objective"
    difficulty: "complex"
    query: >
      How many participants were flagged as depressed at end-of-term AND had
      an above-median average 14-day rolling screen unlock count? The median
      is computed across all participants who have both sensor data and an
      end-of-term assessment.
    hint: >
      Compute the per-participant mean of
      `f_screen:phone_screen_rapids_countepisodeunlock:14dhist` from the
      `screen` dataset (FeatureData). Inner-join with the `dep_endterm`
      dataset (SurveyData) on `pid`. Compute the median of the screen means
      within this joined set. Count participants where `dep` is True and
      screen mean is above the median.

  - id: "obj_015"
    category: "objective"
    difficulty: "complex"
    query: >
      What is the Pearson correlation between participants' pre-study
      perceived stress (PSS-10) and their average 14-day rolling total
      sleep duration (main)? Only include participants present in both
      datasets. Round to 4 decimal places.
    hint: >
      The `pre` dataset (SurveyData) has column `PSS_10items_PRE`. The
      `sleep` dataset (FeatureData) has column
      `f_slp:fitbit_sleep_summary_rapids_sumdurationasleepmain:14dhist`.
      Compute the per-participant mean sleep duration, join with `pre` on
      `pid`, drop rows with NaN, and compute the Pearson correlation.

