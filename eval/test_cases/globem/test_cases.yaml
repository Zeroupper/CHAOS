# CHAOS Evaluation Test Cases — GLOBEM Dataset (INS-W_1 cohort)
# Expected answers for objective cases are in verify_test_cases.py
# Dataset: datasets/globem-dataset-multi-year-datasets-for-longitudinal-human-behavior-modeling-generalization-1.1/

# Hints point to the correct datasets/columns. They are appended to the query
# only when `use_hints: true` in the run configuration (default). Set
# `use_hints: false` to benchmark without hints.

test_cases:

