# =============================================================================
# CHAOS Eval — Multi-Model Comparison Config
# =============================================================================
# Usage: python -m eval --config eval/configs/run_configuration.yaml
#
# This file defines the full evaluation suite. Every field below is optional
# except `models[].name` and `models[].model`.
# =============================================================================

# --- Global settings --------------------------------------------------------

# LLM used as judge for subjective rubric scoring (default: anthropic/claude-sonnet-4-20250514)
judge_model: "anthropic/claude-haiku-4.5"

# How many times to repeat each (configuration × query) pair (default: 5)
n_repeats: 1

# Max concurrent workers for the parallel runner (default: 3)
max_workers: 6

# Path to datasets used by CHAOS and RAG pipelines
# datasets_dir: "datasets/gloss_sample"
datasets_dir: "datasets/globem-dataset-multi-year-datasets-for-longitudinal-human-behavior-modeling-generalization-1.1/INS-W_1"

# Path to test cases file
# test_cases_path: "eval/test_cases/gloss/test_cases.yaml"
test_cases_path: "eval/test_cases/globem/test_cases.yaml"

# Directory where results and reports are written
output_dir: "eval_results"

# Append column/dataset hints to queries (default: true). Set to false to
# test without hints.
use_hints: True

# --- Models ----------------------------------------------------------------
# Each entry runs as an independent pipeline. The runner executes ALL
# models × ALL test cases × n_repeats in parallel.
#
# Fields per model:
#   name      (required)  — unique label, appears in reports and filenames
#   model     (required)  — OpenRouter model ID (provider/model-name)
#   pipeline  (optional)  — "chaos" (default) or "rag"
#   base_url  (optional)  — OpenAI-compatible API base URL for local models
#                           e.g. "http://localhost:11434/v1" for Ollama
#   sandbox   (optional)  — true/false, enable sandboxed code execution (default: false)
#   system_prompt_overrides (optional) — dict of agent_name → custom system prompt

models:
  # -- CHAOS pipeline variants -----------------------------------------------
  # - name: chaos_deepseek-r1-32b
  #   model: deepseek/deepseek-r1-distill-qwen-32b
  #   pipeline: chaos
  #   sandbox: true

  - name: chaos_qwen-3.5-35b-a3b
    model: qwen/qwen3.5-35b-a3b
    base_url: "https://openrouter.ai/api/v1"
    pipeline: chaos
    sandbox: true

  # - name: chaos_qwen-3.5-35b-a3b
  #   model: qwen/qwen3.5-35b-a3b
  #   base_url: "https://openrouter.ai/api/v1"
  #   pipeline: chaos
  #   sandbox: true

  # - name: qwen/qwen3.5-397b-a17b
  #   model: qwen/qwen3.5-397b-a17b
  #   base_url: "https://openrouter.ai/api/v1"
  #   pipeline: chaos
  #   sandbox: true

  # -- RAG baseline variants -------------------------------------------------

  # - name: rag_qwen/qwen3.5-35b-a3b
  #   model: qwen/qwen3.5-35b-a3b
  #   base_url: "https://openrouter.ai/api/v1"
  #   pipeline: rag

  # -- Local models (Ollama / vLLM) ------------------------------------------
  # Requires a running local inference server. No API key needed.
  # Ollama: ollama pull qwen3.5:2b && ollama serve
  # vLLM:   vllm serve Qwen/Qwen3.5-2B --port 8000

